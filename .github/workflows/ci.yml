name: Server boundary
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          path: server
      - name: Read the immutable fork browser source pin
        id: pin
        run: |
          commit=$(node -p 'require("./server/web-artifact/manifest.json").source.commit')
          printf '%s' "$commit" | grep -Eq '^[0-9a-f]{40}$'
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: maxzhao/zennotes
          ref: ${{ steps.pin.outputs.commit }}
          path: browser
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - run: npm ci && npm run artifact:web
        working-directory: browser
      - name: Pin the locally built fork artifact
        env:
          WEB_COMMIT: ${{ steps.pin.outputs.commit }}
        run: node server/scripts/pin-fork-web.mjs browser/dist/web-artifacts server/web-artifact "$WEB_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: fork-browser
          path: |
            server/web-artifact/manifest.json
            server/web-artifact/*.tgz
  go:
    needs: browser
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: fork-browser
          path: web-artifact
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath -o bin/server-api ./cmd/zennotes-server
      - run: go run ./cmd/prepare-web -manifest web-artifact/manifest.json -output web/dist
      - run: go test -tags=embed_web ./web
      - run: go build -tags=embed_web -trimpath -o bin/zennotes-server ./cmd/zennotes-server
  docker:
    needs: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: fork-browser
          path: web-artifact
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
  nix:
    # Optional upstream packaging needs a separately reviewed fork vendorHash.
    if: github.repository == 'ZenNotes/znserver'
    needs: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: fork-browser
          path: web-artifact
      - name: Build server with pinned Nix toolchain and browser artifact
        run: docker run --rm -v "$PWD:/source:ro" nixos/nix@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c sh -c 'cd /source && nix-build --no-out-link'
